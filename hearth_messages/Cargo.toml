[package]
name = "hearth-messages"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hearth_common = { path = "../hearth_common" }
anyhow = "1.0.104"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
hearth-svc = { path = "../hearth_svc" }
hearth_markdown_parser = { path = "../packages/markdown_parser/rust" }
futures = "0.3.34"
linkify = "0.11.0"
mime_guess = "2.0.5"
rmp-serde = "1.3"
scylla = { version = "1.9.0", features = ["chrono-04"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
hearth-svc = { path = "../hearth_svc", features = ["mock"] }

[features]
default = []
scylla = ["dep:scylla", "hearth-svc/scylla"]
