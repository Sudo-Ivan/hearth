[workspace]
members = [
	"hearth_admin",
	"hearth_app_proxy",
	"hearth_common",
	"hearth_media_proxy",
	"hearth_gifs",
	"hearth_svc",
	"hearth_messages",
	"hearth_push",
	"hearth_snowflakes",
	"tools/ci",
	"tools/dev",
	"hearth_users",
	"hearth_unfurl",
	"packages/markdown_parser/rust",
]
exclude = [
	"packages/markdown_parser/rust/fuzz",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
