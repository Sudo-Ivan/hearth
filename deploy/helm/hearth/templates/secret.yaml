{{- include "hearth.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: hearth-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hearth.labels" (dict "root" . "name" "hearth-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := include "hearth.secretData" . | fromJson }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
{{- end }}
