# SPDX-License-Identifier: AGPL-3.0-or-later
id: app.hearth.Hearth
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
branch: stable
command: app.hearth.Hearth
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=pcsc
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.gnome.Mutter.IdleMonitor
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  strip: false
  no-debuginfo: true
cleanup-commands:
  - rm -f /app/hearth/chrome-sandbox
modules:
  - name: hearth
    buildsystem: simple
    build-commands:
      - install -Dm755 app.hearth.Hearth.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -d ${FLATPAK_DEST}/share/hearth
      - printf '%s\n' https://pkgs.hearth.com/flatpak/ > ${FLATPAK_DEST}/share/hearth/flatpak-repository
      - mkdir -p ${FLATPAK_DEST}/hearth
      - cp -a app/. ${FLATPAK_DEST}/hearth/
      - patch-electron-desktop-filename ${FLATPAK_DEST}/hearth/resources/app.asar
      - install -Dm644 app.hearth.Hearth.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 app.hearth.Hearth.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 app.hearth.Hearth.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: file
        path: app.hearth.Hearth.sh
      - type: file
        path: app.hearth.Hearth.desktop
      - type: file
        path: app.hearth.Hearth.metainfo.xml
      - type: file
        path: app.hearth.Hearth.svg
