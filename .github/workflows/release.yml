# SPDX-License-Identifier: AGPL-3.0-or-later
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build hearthctl ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hearthctl/go.mod
          cache: false
      - name: Build binary
        working-directory: hearthctl
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "../dist/hearthctl-${GOOS}-${GOARCH}" .
      - name: Generate checksums
        working-directory: dist
        env:
          BIN: hearthctl-${{ matrix.goos }}-${{ matrix.goarch }}
        run: sha256sum "${BIN}" >> checksums.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hearthctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  package:
    name: assemble release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      subjects-as-file: ${{ steps.subjects.outputs.handle }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hearthctl-*
          path: artifacts
      - name: Assemble dist and subjects file
        run: |
          set -euo pipefail
          mkdir -p dist
          for d in artifacts/hearthctl-*/; do
            cp "${d}"hearthctl-* dist/
            cat "${d}checksums.txt" >> dist/checksums.txt
          done
          sort -k2 -o dist/checksums.txt dist/checksums.txt
          (cd dist && sha256sum -- * > ../subjects.txt)
          cat dist/checksums.txt
      - name: Upload subjects file for provenance
        id: subjects
        uses: slsa-framework/slsa-github-generator/actions/generator/generic/create-base64-subjects-from-file@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
        with:
          path: subjects.txt
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  provenance:
    name: generate SLSA provenance
    needs: package
    permissions:
      actions: read
      id-token: write
      contents: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects-as-file: ${{ needs.package.outputs.subjects-as-file }}
      provenance-name: hearthctl.intoto.jsonl
      upload-assets: false

  release:
    name: publish GitHub release
    needs: [package, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Download provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls dist provenance
          gh release create "${TAG}" \
            --title "hearthctl ${TAG}" \
            --generate-notes \
            dist/* provenance/*.intoto.jsonl
      - name: Verify or create attestation for checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          if ! gh attestation verify checksums.txt --repo "${REPO}"; then
            gh attestation attest checksums.txt --repo "${REPO}"
            gh attestation verify checksums.txt --repo "${REPO}"
          fi
